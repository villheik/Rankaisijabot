starting_balance: 1000

loan:
  max_amount: 1000
  interest_rate: 0.20

luck:
  max_level: 20
  cost_base: 100

jackpot:
  base_chance: 1.0        # % mahdollisuus 0 spinillä
  spins_per_percent: 2    # montako slottispiniä lisää 1 %:n (0.5% per spini)
  max_chance: 75.0        # katto
  payout_multiplier: 10   # jackpot = symbol.payout × per_line_bet × kerroin

auto_collect_threshold: 3

symbols:
  # Yleiset hedelmät — korkea paino, matala payout, plateau luck ~7
  - emoji: "🍉"
    name: "Vesimeloni"
    weight: 24
    luck_weight_scale: 0.3
    max_weight: 26
    payout: 14
    two_plus_wild_payout: 9
  - emoji: "🍐"
    name: "Päärynä"
    weight: 20
    luck_weight_scale: 0.3
    max_weight: 22
    payout: 14
    two_plus_wild_payout: 9
  - emoji: "🍇"
    name: "Viinirypäleet"
    weight: 18
    luck_weight_scale: 0.3
